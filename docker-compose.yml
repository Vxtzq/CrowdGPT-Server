services:
  orchestrator:
    build: .
    image: crowdgpt-orchestrator:local
    restart: unless-stopped
    init: true
    ports:
      - "5006:5006"
    environment:
      CROWDGPT_ADMIN_SECRET: "${CROWDGPT_ADMIN_SECRET:?set CROWDGPT_ADMIN_SECRET}"
      CROWDGPT_PUBLIC_URL: "${CROWDGPT_PUBLIC_URL:-http://localhost:5006}"
      CROWDGPT_TRUSTED_PROXIES: "${CROWDGPT_TRUSTED_PROXIES:-}"
      CROWDGPT_EVAL_URL: "${CROWDGPT_EVAL_URL:-}"
      CROWDGPT_LOSS_CHECK_MODE: "${CROWDGPT_LOSS_CHECK_MODE:-off}"
    volumes:
      # Holds the orchestrator SQLite database and the local object store.
      # A named volume inherits the image's /data ownership (UID 10001).
      # A host bind mount must be chowned to 10001:10001 first.
      - crowdgpt-data:/data
      # Model checkpoints, uploaded deltas, accounts and logs are written next
      # to server.py (/app), not under /data. They live in the container layer
      # and are lost when the container is recreated. See docs/DEPLOYMENT.md
      # for bind mounts that persist them.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/api/stats', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

volumes:
  crowdgpt-data:
